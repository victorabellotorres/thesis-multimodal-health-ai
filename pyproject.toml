[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-health-ai"
version = "0.1.0"
description = "Reproducible data and evaluation code for a multimodal nutrition thesis"
requires-python = ">=3.10"

[project.scripts]
nutrition5k = "nutrition5k.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-health-ai"
version = "0.1.0"
description = "Reproducible data and evaluation code for a multimodal nutrition thesis"
requires-python = ">=3.10"
dependencies = [
	"imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
train = [
	"torch>=2.2",
	"torchvision>=0.17",
	"timm>=1.0.9",
	"pillow>=10.0",
	"pandas>=2.0",
	"matplotlib>=3.8",
	"wandb>=0.17",
]

[project.scripts]
nutrition5k = "nutrition5k.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

